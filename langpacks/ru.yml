loader_restrictor:
  name: "LoaderRestrictor"
  q1: "На что способен любой модуль, который вы устанавливаете?"
  q1_ans1: "Ровно то, что написано в его описании - не больше и не меньше"
  q1_ans2: "Может читать переписку только в том чате, где его вызвали"
  q1_ans3: "Может действовать только тогда, когда вы сами вызываете его команду"
  q1_ans4: "То же самое, что и вы сами в Telegram, и даже больше: передача подарков, удаление аккаунта и т.д."
  q1_hint: "Хотя в юзерботе стоит базовая защита от опасных запросов, модуль всё ещё может получить полное управление вашим аккаунтом"
  q2: "Вам написал незнакомец и просит протестировать его модуль. Ваши действия?"
  q2_ans1: "Конечно помогу ему, почему бы и нет?"
  q2_ans2: "Проверю код (сам/нейросетью). При сомнениях напишу в саппорт с #check_scam, укажу, кто поделился"
  q2_ans3: "Спрошу у самого автора, безопасен ли модуль, поверю ему на слово"
  q2_ans4: "Установлю на другом аккаунте, чтобы протестировать, так безопаснее"
  q2_hint: "Любые модули не из каналов официальных разработчиков ('#modules' в саппорте/чате оффтопа) стоит проверять на наличие опасного кода. Не подвергайте себя риску!"
  q3: "Может ли модуль работать с файлами и системой сервера/хостинга, а не только с Telegram?"
  q3_ans1: "Нет, модуль работает только внутри Telegram и не видит остальные файлы"
  q3_ans2: "Только если у него есть отдельное разрешение от Telegram"
  q3_ans3: "Да - модуль это часть самого юзербота: может читать, менять и удалять файлы, как и любая программа"
