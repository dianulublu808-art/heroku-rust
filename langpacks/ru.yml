  heroku: "{} <b>{}.{}.{}</b> <i>{}</i>\n\n<tg-emoji emoji-id=5289608677244811430>📁</tg-emoji> <b>heroku-tl:</b> <i>{}</i>\n\n<tg-emoji emoji-id=5228879218363872764>⌨</tg-emoji> <b>Developer: <a href=\"t.me/zetgo\">@zetgo</a></b>"
  rich_heroku_message: "<figure><img src=\"{banner_url}\"/></figure><h1>{platform} Userbot</h1><table bordered><tr><th>Компонент</th><th>Текущий релиз</th></tr><tr><td><b>Версия</b></td><td><code>{version}</code></td></tr><tr><td><b>Сборка</b></td><td>{build}</td></tr><tr><td><b>Heroku TL</b></td><td><code>{htl_version}</code></td></tr><tr><td><b>Слой API</b></td><td><code>{layer}</code></td></tr><tr><td><b>Текущий пользователь</b></td><td><code>{current_user}</code></td></tr><tr><td><b>Разработчик</b></td><td><a href=\"https://t.me/zetgo\">@zetgo</a></td></tr></table>"
  happy_beta: "\n\n<tg-emoji emoji-id=5465188915990255885>🌟</tg-emoji> <b>Вы счастливый обладатель <code>{}</code> версии!</b>"
  unstable: "\n\n<tg-emoji emoji-id=5355133243773435190>❕</tg-emoji> <b>Вы используете нестабильную ветку</b> <code>{}</code><b>!</b>"
  module_cleared: "🗑 <code>{}</code>"
  installation_title: "🪐 <b>Установка Heroku</b>"
  installation_note: "<i>Сборка на Rust: используйте <code>cargo build --release</code> и запустите <code>./target/release/heroku</code>.</i>"
  choose_installation: "<tg-emoji emoji-id=5363805650327450240>🪐</tg-emoji> <b>Выберите вариант установки Heroku:</b>"
  vds: "💎 VDS"
  wsl: "💻 WSL"
  userland: "🐧 UserLand"
  hikkahost: "🌼 HikkaHost"
  universal: "🌐 Универсальная"
  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> Процесс установки на VDS выполняется одной командой:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install git cargo &amp;&amp; git clone https://github.com/dianulublu808-art/heroku-rust &amp;&amp; cd heroku-rust &amp;&amp; cargo build --release &amp;&amp; ./target/release/heroku</code></pre>\n<i>Примечание: Если у вас отсутствуют права sudo, исключите соответствующую часть команды.</i>"
  wsl_install: "<b>Скачай WSL.</b> Для этого открой PowerShell с правами администратора и напиши <code>wsl --install -d Ubuntu-22.04</code> \n⚠️ <i>Для установки WSL необходима Windows 10 build 2004 или Windows 11 любой версии и ПК с поддержкой виртуализации. Для установки на более ранние версии ОС обратись к</i> <a href=\"https://learn.microsoft.com/ru-ru/windows/wsl/install-manual\">этой странице</a>\n\n⬜️ <b>Перезагрузи ПК и запусти приложение Ubuntu 22.04.x</b> \n\n⬜️ <b>Вставь в него команду (ПКМ):</b> <code>curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y</code> \n⚠️ <i>При появлении желтых предупреждений введи</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code> <i>заменив /home/username/.local/bin на тот путь, о котором говорится в сообщении</i>\n\n⬜️ <b>Вставь команду (ПКМ):</b> \n<pre><code class=\"language-bash\">source \"$HOME/.cargo/env\" &amp;&amp; git clone https://github.com/dianulublu808-art/heroku-rust &amp;&amp; cd heroku-rust &amp;&amp; cargo build --release &amp;&amp; ./target/release/heroku</code></pre>\n🔗 <b>Где получить API_ID и API_HASH?</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">Видео</a>"
  userland_install: "<b>Установи UserLAnd по</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">ссылке</a>\n\n<b>Открой его, выбери Ubuntu —&gt; Minimal —&gt; Terminal</b>\n\n<b>Жди установки дистрибутива, можешь налить чаю</b>\n\n<b>После успешной установки перед тобой откроется терминал, пиши туда:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install git cargo -y &amp;&amp; git clone https://github.com/dianulublu808-art/heroku-rust &amp;&amp; cd heroku-rust &amp;&amp; cargo build --release &amp;&amp; ./target/release/heroku</code></pre>\n\n<b>В конце установки появится ссылка, переходи по ней и вводи данные своего аккаунта для входа.\n\nВуаля! Вы установили Heroku на UserLAnd.</b>"
  hikkahost_install: "<b>🌘 Как установить Heroku на HikkaHost?</b>\n\n1. Перейдите в @hikkahost_bot\n2. Выберите «Установить»\n3. Выберите «🪐 Heroku»\n\nИ продолжайте установку.\n\n<b>После этого вы получите ссылку, откройте ее и войдите в свой аккаунт.</b>"
  universal_install: "🌐 <b>Универсальный установщик</b> (Linux, WSL, UserLAnd): ставит всё нужное и запускает Heroku одной командой:\n<pre><code class=\"language-bash\">curl -fsSL https://raw.githubusercontent.com/dianulublu808-art/heroku-rust/main/install.sh | bash</code></pre>\n<i>Та же команда при повторном запуске просто запустит установленный Heroku. Для root добавь</i> <code>-s -- --root</code>"
  cleardb_confirm: "⚠️ Удалить всю базу данных? Выполните <code>.cleardb --force</code> для подтверждения."
  cleardb_done: "✅ База данных очищена"
