  happy_beta: "\n\n<tg-emoji emoji-id=5465188915990255885>🌟</tg-emoji>  <b>あなたは、<code>{}</code>バージョンの幸運な所有者ですね！</b>"
  unstable: "\n\n<tg-emoji emoji-id=5355133243773435190>❕</tg-emoji> <b>不安定なブランチ</b> <code>{}</code> <b>を使用しています！</b>"
  module_cleared: "🗑 <code>{}</code>"
  installation_title: "🪐 <b>Heraku のインストール</b>"
  installation_note: "<i>Rust ビルド: <code>cargo build --release</code> を使用して <code>./target/release/heroku</code> を実行します。</i>"
  choose_installation: "<tg-emoji emoji-id=5363805650327450240>🪐</tg-emoji> <b>Heroku インストールオプションを選択してください:</b>"
  vds: "💎 VDS"
  wsl: "💻 WSL"
  userland: "🐧 UserLand"
  hikkahost: "🌼 HikkaHost"
  universal: "🌐 ユニバーサル"
  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> VDS でのインストールプロセスは単一のコマンドで完了します:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install git cargo &amp;&amp; git clone https://github.com/dianulublu808-art/heroku-rust &amp;&amp; cd heroku-rust &amp;&amp; cargo build --release &amp;&amp; ./target/release/heroku</code></pre>\n<i>注: sudo 権限がない場合は、コマンドの該当部分を省略してください。</i>"
  wsl_install: "<b>WSL をダウンロードします。</b> これを行うには、PowerShell を管理者として開き、<code>wsl --install -d Ubuntu-22.04</code> と入力します \n⚠️ <i>WSL をインストールするには、Windows 10 ビルド 2004 または Windows 11 の任意のバージョンと、仮想化サポートを備えた PC が必要です。以前のバージョンの OS へのインストールについては、</i> <a href=\"https://learn.microsoft.com/ru-ru/windows/wsl/install-manual\">このページ</a><i>を参照してください</i>\n\n⬜️ <b>PC を再起動し、Ubuntu 22.04.x アプリケーションを起動します</b> \n\n⬜️ <b>その中にコマンドを貼り付けます (右クリック):</b> <code>curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y</code> \n⚠️ <i>黄色い警告が表示された場合は、</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code> <i>と入力し、/home/username/.local/bin をメッセージに記載されているパスに置き換えてください</i>\n\n⬜️ <b>コマンドを貼り付けます (右クリック):</b> \n<pre><code class=\"language-bash\">source \"$HOME/.cargo/env\" &amp;&amp; git clone https://github.com/dianulublu808-art/heroku-rust &amp;&amp; cd heroku-rust &amp;&amp; cargo build --release &amp;&amp; ./target/release/heroku</code></pre>\n🔗 <b>API_ID と API_HASH はどこで入手できますか？</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">ビデオ</a>"
  userland_install: "<b>UserLAnd をこの</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">リンク</a><b>からインストールします</b>\n\n<b>開き、Ubuntu —&gt; Minimal —&gt; Terminal を選択します</b>\n\n<b>ディストリビューションのインストールを待ちます（お茶でも飲んで待っていてください）</b>\n\n<b>インストールが成功するとターミナルが開くので、そこに入力します:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install git cargo -y &amp;&amp; git clone https://github.com/dianulublu808-art/heroku-rust &amp;&amp; cd heroku-rust &amp;&amp; cargo build --release &amp;&amp; ./target/release/heroku</code></pre>\n\n<b>インストールの最後にリンクが表示されるので、それに従ってアカウント情報を入力し、ログインします。\n\nこれで UserLAnd に Heroku がインストールされました。</b>"
  hikkahost_install: "<b>🌘 HikkaHost に Heroku をインストールするには？</b>\n\n1. @hikkahost_bot に移動します\n2. \"Install\" を選択します\n3. \"🪐 Heroku\" を選択します\n\nそしてインストールを続けます。\n\n<b>その後、リンクを受け取るので、それを開いてアカウントにログインしてください。</b>"
  universal_install: "🌐 <b>ユニバーサルインストーラー</b> (Linux、WSL、UserLAnd): 必要なものをすべて入れて、Herokuを一つのコマンドで起動します:\n<pre><code class=\"language-bash\">curl -fsSL https://raw.githubusercontent.com/dianulublu808-art/heroku-rust/main/install.sh | bash</code></pre>\n<i>同じコマンドをもう一度実行すると、インストール済みのHerokuが起動するだけです。rootの場合はこれを追加</i> <code>-s -- --root</code>"
  cleardb_confirm: "🗑 データベースをクリア"
  cleardb_done: "✅ データベースがクリアされました"
