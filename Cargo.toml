[package]
name = "heroku"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Heroku Userbot — Rust rewrite"
license = "AGPL-3.0"
repository = "https://github.com/Heroku-userbot/Heroku"

[[bin]]
name = "heroku"
path = "src/main.rs"

[dependencies]
grammers-client = { version = "0.12.0", features = ["html"] }
grammers-mtsender = "0.12.0"
grammers-session = { version = "0.12.0", features = ["sqlite-storage"] }
grammers-tl-types = "0.12.0"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"
inventory = "0.3"
once_cell = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

regex = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rhai = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
